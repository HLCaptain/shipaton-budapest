version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # @astrojs/check 0.9.9 supports TypeScript 5 and 6 only.
    ignore:
      - dependency-name: typescript
        versions:
          - "7.x"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
