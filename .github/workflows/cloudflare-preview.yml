name: Cloudflare Preview & CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CLOUDFLARE_PAGES_PROJECT: shipaton-budapest

jobs:
  validate:
    name: Check, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_REF" || git fetch --depth=1 origin "$CHECKOUT_SHA"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local responsive UI tests
        run: npm run test:ui

  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'cloudflare-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Cloudflare configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_REF" || git fetch --depth=1 origin "$CHECKOUT_SHA"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Build Cloudflare assets
        if: steps.config.outputs.configured == 'true'
        run: npm run build

      - name: Deploy branch
        if: steps.config.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || env.CLOUDFLARE_PAGES_PROJECT }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          deploy_output="$(npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$PREVIEW_BRANCH")"
          printf '%s\n' "$deploy_output"
          deployment_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          test -n "$deployment_url" || (echo "::error::Unable to parse Cloudflare preview URL" && exit 1)
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare deployment"
            echo ""
            echo "$deployment_url"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ui-tests:
    name: Hosted responsive UI tests
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always() && needs.validate.result == 'success' && needs.deploy.result == 'success' && needs.deploy.outputs.preview-url != ''
    steps:
      - name: Check preview accessibility
        id: preview
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview-url }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/shipaton-preview.html"
          final_url="$(curl -L --max-time 20 --silent --show-error --output "$response_file" --write-out '%{url_effective}' "$PREVIEW_URL")"
          if [[ "$final_url" == *"cloudflareaccess.com"* ]] || grep -Eqi "Log in to .*Cloudflare Pages" "$response_file"; then
            echo "accessible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hosted responsive UI tests skipped: the Cloudflare preview is protected by Cloudflare Access."
            {
              echo "### Hosted responsive UI tests"
              echo ""
              echo "Skipped because the preview is protected by Cloudflare Access. Local responsive UI tests remain required."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "accessible=true" >> "$GITHUB_OUTPUT"
            if ! grep -q "static.cloudflareinsights.com/beacon.min.js" "$response_file"; then
              echo "::error::Cloudflare Web Analytics beacon was not injected into the deployment."
              exit 1
            fi
          fi

      - name: Checkout
        if: steps.preview.outputs.accessible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_REF" || git fetch --depth=1 origin "$CHECKOUT_SHA"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        if: steps.preview.outputs.accessible == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.preview.outputs.accessible == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run responsive UI tests
        if: steps.preview.outputs.accessible == 'true'
        run: npm run test:ui
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.deploy.outputs.preview-url }}
