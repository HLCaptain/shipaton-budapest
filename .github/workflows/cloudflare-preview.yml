name: Cloudflare Preview & CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CLOUDFLARE_PAGES_PROJECT: shipaton-budapest

jobs:
  validate:
    name: Check, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local responsive UI tests
        run: npm run test:ui

      - name: Upload local Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-local
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'cloudflare-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Cloudflare configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Build Cloudflare assets
        if: steps.config.outputs.configured == 'true'
        run: npm run build

      - name: Deploy branch
        if: steps.config.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || env.CLOUDFLARE_PAGES_PROJECT }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          deploy_output="$(npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$PREVIEW_BRANCH")"
          printf '%s\n' "$deploy_output"
          deployment_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          test -n "$deployment_url" || (echo "::error::Unable to parse Cloudflare preview URL" && exit 1)
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare deployment"
            echo ""
            echo "$deployment_url"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ui-tests:
    name: Hosted responsive UI tests
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always() && needs.validate.result == 'success' && needs.deploy.result == 'success' && needs.deploy.outputs.preview-url != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive UI tests
        run: npm run test:ui
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.deploy.outputs.preview-url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-hosted
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
