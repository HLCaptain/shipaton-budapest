name: Cloudflare Preview & CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Owner-only Actions policy: use the hosted runner's Git and Node directly.
jobs:
  validate:
    name: Check, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui

  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    # Native Cloudflare integration supplies PR previews without Actions secrets.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Checkout validated revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - run: npm ci
      - run: npm run build
      - name: Deploy validated main revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'shipaton-budapest' }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are missing."
            exit 1
          fi
          npx --no-install wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch=main --commit-hash="$GITHUB_SHA"
